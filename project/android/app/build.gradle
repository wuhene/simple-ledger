plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wuhene.simpleledger'
    compileSdk 35

    sourceSets {
        main.assets.srcDir '../../shared/assets'
    }

    defaultConfig {
        applicationId 'com.wuhene.simpleledger'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.2.10'
    }

    buildTypes {
        acceptance {
            initWith debug
            applicationIdSuffix '.acceptance'
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
