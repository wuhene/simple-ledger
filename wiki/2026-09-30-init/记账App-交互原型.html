let page='home',type='支出',period='月',billMode='月',year=2026,month=9,expr='',cat='餐饮',allCats=false,editing=false,hide=false,budget=10000,asset=null,liability=null,modal='',dataAdds=[],statsOffset=0,entryDateDraft='2026-09-30',entryNoteDraft='';

function openEntry(edit=false){entryDateDraft=edit?chosen.date:'2026-09-30';entryNoteDraft=edit?chosen.note:'';editing=edit;expr=edit?chosen.amount.replace(/[−+,]/g,''):'';type=edit&&chosen.amount[0]==='+'?'收入':'支出';cat=edit?chosen.name:'餐饮';navigate('entry')}

are()">预览并分享报告</button>`}

const nav=main?`<button class="fab" onclick="openEntry()">${icon('plus')}记一笔</button><nav class="nav">${[['home','明细','tool'],['stats','统计','chart'],['tools','工具','box'],['mine','我的','user']].map(([p,t,i])=>`<button class="${p===page?'active':''}" onclick="navigate('${p}')">${icon(i)}${t}</button>`).join('')}</nav>`:'';document.getElementById('phone').innerHTML=top+`<section class="content ${main?'':'no-nav'} ${page==='entry'?'entry':''}">${body}</section>`+nav;if(modal)mountModal(modal)}
function key(k){if(k==='清空')expr='';else if(k==='⌫')expr=expr.slice(0,-1);else if(k==='+'||k==='−'){if(expr){if(/[+−]$/.test(expr))expr=expr.slice(0,-1)+k;else expr+=k}}else{let curr=expr.split(/[+−]/).pop();if(k==='.'&&curr.includes('.'))return;if(curr.includes('.')&&curr.split('.')[1].length+k.length>2)return;if(expr.length>30)return;expr+=(k==='.'&&!curr?'0.':k)}document.getElementById('expression').textContent=expr||'0.00';document.getElementById('err').textContent=''}
function sumExpr(s){if(!s||/[+−]$/.test(s))return NaN;let terms=s.match(/[+−]?\d+(?:\.\d{0,2})?/g);if(!terms||terms.join('')!==s)return NaN;return terms.reduce((a,v)=>a+Math.round(Number(v.replace('−','-'))*100),0)/100}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveEntry(){let n=sumExpr(expr),d=document.getElementById('entryDate').value,note=document.getElementById('entryNote').value;if(!(n>0&&n<=99999999.99)||!d||d>'2026-09-30'){document.getElementById('err').textContent='请填写有效金额与不晚于今天的日期';return}let item={name:cat,amount:(type==='收入'?'+':'−')+n.toFixed(2),note:note,date:d};if(editing){chosen=item;navigate('detail');toast('演示修改已保存，参考快照不变')}else{dataAdds.unshift(item);year=2026;month=9;navigate('home');toast('演示记录已保存；汇总为参考快照')}}
function goBack(){if(page==='entry'&&expr){showModal(`<h3>放弃这笔记录？</h3><p class="muted">尚未保存的输入将丢弃。</p><button class="primary" onclick="closeModal()">继续填写</button><button class="outline" onclick="navigate('home')">放弃</button>`);return}let dest={detail:'home',entry:'home',category:'stats',bills:'tools',report:'bills',annual:'bills',budget:'tools',assets:'tools',categories:'mine',settings:'mine'};navigate(dest[page]||'home')}
function toast(t){let old=document.querySelector('.toast');if(old)old.remove();let x=document.createElement('div');x.className='toast';x.textContent=t;document.getElementById('phone').append(x);setTimeout(()=>x.remove(),3200)}
function mountModal(html){let x=document.createElement('div');x.className='modalback';x.innerHTML=`<div class="modal">${html}<button class="outline" onclick="closeModal()">关闭</button></div>`;document.getElementById('phone').append(x)}function showModal(html){modal=html;mountModal(html)}function closeModal(){modal='';document.querySelector('.modalback')?.remove()}
function showMonth(){showModal(`<h3>选择年月</h3><input id="ym" class="field" type="month" value="${year}-${String(month).padStart(2,'0')}"><button class="primary" onclick="pickMonth()">确定</button>`)}function pickMonth(){let v=document.getElementById('ym').value;if(!v)return;[year,month]=v.split('-').map(Number);closeModal();render()}
function openBill(n){if(billMode==='月'){month=parseInt(n);navigate('report')}else{year=parseInt(n);navigate('annual')}}
function saveBudget(){let n=Number(document.getElementById('budgetVal').value);if(!Number.isFinite(n)||n<=0||n>99999999.99||Math.abs(Math.round(n*100)-n*100)>0.00001){toast('预算需大于0、最多两位小数');return}budget=n;render();toast('演示预算已保存')}
function saveAssets(){let a=document.getElementById('assetVal').value,b=document.getElementById('liabilityVal').value;if(a===''||b===''){toast('请填写资产与负债，允许填0');return}a=Number(a);b=Number(b);if(!Number.isFinite(a+b)||a<0||b<0||Math.max(a,b)>99999999.99){toast('请输入有效的非负金额');return}asset=a;liability=b;render();toast('演示资产已保存')}
function showShare(){showModal(`<h3>分享报告</h3><div class="preview"><span class="tag">简账 · ${year}年${month}月</span><div class="caption" style="margin-top:16px">本月结余 · 参考快照</div><div class="amount">${fmt(12086.95)}</div><div class="row"><span>收入 ${fmt(19601.12)}</span><span>支出 ${fmt(7514.17)}</span></div></div><p><label><input type="checkbox"> 包含单笔排行</label></p><p><label><input type="checkbox"> 包含记账成就</label></p><div class="tip">默认不含备注与资产。正式版生成图片并打开系统分享面板。</div><button class="primary" onclick="toast('分享布局演示完成；原型不生成或发送图片')">分享（演示）</button>`)}
function deleteDemo(){showModal(`<h3>删除这笔记录？</h3><p>${chosen.name} · ${chosen.amount} · ${chosen.date}</p><button class="primary" style="background:var(--red)" onclick="navigate('home');toast('删除流程演示；参考数据未删除')">确认删除（演示）</button>`)}
function showRestore(){showModal('<h3>恢复备份 · 流程说明</h3><p class="muted">正式版先校验文件版本、记录数量、日期和分类，再显示恢复预览。确认后全量替换，并保留恢复前备份。</p><div class="tip">原型不选择文件，不修改真实数据。</div>')}
function newCat(){showModal('<h3>新增分类</h3><input class="field" id="newCatName" maxlength="8" placeholder="分类名称，最多8字"><button class="primary" onclick="addCat()">保存分类</button>')}
function addCat(){let n=document.getElementById('newCatName').value.trim();let arr=type==='支出'?expenseCats:incomeCats;if(!n||/[<>&"'\\]/.test(n)||arr.includes(n)){toast('名称不能为空或重复');return}arr.push(safe(n));closeModal();render();toast('演示分类已添加')}
function toggleCat(n){let arr=type==='支出'?expenseCats:incomeCats;if(!hiddenCats.has(n)&&arr.filter(c=>!hiddenCats.has(c)).length===1){toast('至少保留一个分类');return}hiddenCats.has(n)?hiddenCats.delete(n):hiddenCats.add(n);render()}
render();
</script></body></html>
