<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1320" height="950" viewBox="0 0 1320 950" role="img" aria-labelledby="title desc">
  <title id="title">简账二版 UI 静态视觉稿</title>
  <desc id="desc">三屏依次展示明细首页、记账日期选择弹层、记一笔页面。画面中的金额均为布局示意。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#1E332A}
      .small{font-size:12px}.caption{font-size:13px}.body{font-size:15px}.sub{font-size:17px;font-weight:600}.title{font-size:23px;font-weight:700}.hero{font-size:34px;font-weight:700}.money{font-size:40px;font-weight:700}.muted{fill:#63766B}.secondary{fill:#52665B}.green{fill:#246B54}.white{fill:#fff}.bold{font-weight:700}.num{font-variant-numeric:tabular-nums}
      .icon{fill:none;stroke:#246B54;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .icon-muted{fill:none;stroke:#63766B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#173A2B" flood-opacity=".12"/></filter>
    <clipPath id="clip1"><rect x="45" y="50" width="390" height="844" rx="32"/></clipPath>
    <clipPath id="clip2"><rect x="465" y="50" width="390" height="844" rx="32"/></clipPath>
    <clipPath id="clip3"><rect x="885" y="50" width="390" height="844" rx="32"/></clipPath>
    <g id="chev"><path d="m2 1 5 5-5 5" class="icon-muted"/></g>
    <g id="calendar"><rect x="1" y="3" width="18" height="17" rx="3" class="icon"/><path d="M1 8h18M6 1v4M14 1v4" class="icon"/><path d="M6 12h2M12 12h2M6 16h2" class="icon"/></g>
    <g id="list"><rect x="1" y="2" width="18" height="19" rx="3" class="icon"/><path d="M6 7h8M6 12h8M6 17h5" class="icon"/></g>
    <g id="chart"><path d="M2 20V3M2 20h18M6 15l4-4 3 2 6-7" class="icon"/></g>
    <g id="grid"><rect x="1" y="1" width="8" height="8" rx="2" class="icon"/><rect x="12" y="1" width="8" height="8" rx="2" class="icon"/><rect x="1" y="12" width="8" height="8" rx="2" class="icon"/><rect x="12" y="12" width="8" height="8" rx="2" class="icon"/></g>
    <g id="person"><circle cx="11" cy="6" r="4" class="icon"/><path d="M3 21c0-5 3-8 8-8s8 3 8 8" class="icon"/></g>
